openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and account operations
  - name: subscription
    description: Subscription access state (trial / Pro / expired)
  - name: journey
    description: Server-side journey/workspace persistence
  - name: account
    description: Account self-service (profile, password, sessions, export, deletion)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: Creates a user with a hashed password and starts email verification. No session is created until the email is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; email verification pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: Verifies credentials and creates a server-side session cookie. Requires a verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Destroys the server session and clears the session cookie.
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: me
      tags: [auth]
      summary: Current user
      description: Resolves the signed-in user from the session cookie.
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address
      description: Consumes a single-use verification token and marks the account verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email
      description: Issues a new verification token when the account exists and is unverified. The response never reveals whether the account exists. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStatusResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      description: Issues a single-use reset token when the account exists. The response never reveals whether the account exists. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStatusResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password
      description: Consumes a single-use reset token, updates the password, and invalidates all existing sessions for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input, or invalid/expired/used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Current subscription access state
      description: |-
        Server-derived subscription state for the authenticated user. The
        backend is the single source of truth; the client never computes or
        stores access. States: trialing (3-day trial active), pro (paid
        access active), expired (trial over, no paid access — data intact,
        Pro capabilities blocked).
      responses:
        "200":
          description: The current access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAccessResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pro/insights:
    get:
      operationId: getProInsights
      tags: [subscription]
      summary: Example Pro capability (foundation proof)
      description: |-
        A harmless Pro-gated capability that proves the server-side Pro
        authorization guard end-to-end. Real Pro features replace this in a
        later phase. Requires a valid session, a verified email, and Pro
        access (paid or trialing — access policy is decided server-side).
      responses:
        "200":
          description: Capability wired and accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProCapabilityResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified, or Pro access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/config:
    get:
      operationId: getBillingConfig
      tags: [billing]
      summary: Frontend-safe billing configuration
      description: |-
        Paddle configuration for the browser: the public client token,
        environment, real price IDs (from env config or live catalog
        discovery), and an honest checkout-availability verdict. Contains no
        secrets — the API key never leaves the server.
      responses:
        "200":
          description: Billing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfigResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/portal-session:
    post:
      operationId: createBillingPortalSession
      tags: [billing]
      summary: Create a Paddle customer portal session
      description: |-
        Starts a Paddle customer portal session for the signed-in user's
        linked billing customer so they can manage their subscription. Requires
        a verified session and Pro access; 409 when no billing profile is
        linked yet, 502 when the provider is temporarily unavailable.
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalSessionResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified, or Pro access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No billing customer linked to this account yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Billing provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journey:
    get:
      operationId: getJourney
      tags: [journey]
      summary: Load the signed-in user's journey state
      description: |-
        Returns the persisted journey/workspace payload for the authenticated
        user, or `{ journey: null }` when nothing has been saved yet. Every
        workspace surface reads this instead of keeping its own store.
      responses:
        "200":
          description: The persisted journey payload, or null when never saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveJourney
      tags: [journey]
      summary: Save the signed-in user's journey state
      description: |-
        Validates and stores the journey/workspace payload server-side. The
        payload shape is enforced by the server schema; unknown fields are
        rejected so the stored state can always be trusted. Server stamps
        updatedAt; client values for it are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneySaveRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneySaveResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/me:
    patch:
      operationId: updateAccount
      tags: [account]
      summary: Update the signed-in user's name
      description: |-
        Updates the account's display name server-side. Email changes are not
        offered in this phase (they require a verified-change flow); the
        response includes the updated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/password:
    post:
      operationId: changePassword
      tags: [account]
      summary: Change the password of the signed-in user
      description: |-
        Requires the current password, sets a new one, and revokes every
        other session (the current device stays signed in).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input, or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/sessions:
    get:
      operationId: listSessions
      tags: [account]
      summary: List the account's active sessions
      description: |-
        Returns the account's non-expired sessions, newest first, including
        whether each row is the current one. Only metadata — never session ids.
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/sessions/others:
    delete:
      operationId: revokeOtherSessions
      tags: [account]
      summary: Sign out every other session
      description: Revokes all of the account's sessions except the current one.
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResult"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/export:
    get:
      operationId: exportAccountData
      tags: [account]
      summary: Export the account's data as JSON
      description: |-
        Returns a single JSON document with the account profile, subscription
        state, journey data, and webhook event count. Intended for the
        Settings data-export control.
      responses:
        "200":
          description: The export document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Delete the account and all of its data
      description: |-
        Permanently deletes the user row; every dependent row (sessions,
        tokens, subscription, journey) is removed by ON DELETE CASCADE.
        Destroys the current session and clears the cookie. Billing must be
        cancelled by the user in the Paddle portal first; Paddle retains its
        own customer/transaction records as the payment processor.
      responses:
        "204":
          description: Account deleted and signed out
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - password

    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - token

    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - token
        - password

    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
      required:
        - id
        - name
        - email
        - emailVerified

    AuthUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user

    RegisterResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        # True only when a provider is configured; the UI must not claim an
        # email was sent when this is false.
        emailDelivered:
          type: boolean
        verificationRequired:
          type: boolean
      required:
        - user
        - emailDelivered
        - verificationRequired

    LoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user

    DeliveryStatusResponse:
      type: object
      properties:
        status:
          type: string
        # Honest delivery state: reflects provider configuration only, never
        # whether the addressed account exists.
        emailDelivered:
          type: boolean
      required:
        - status
        - emailDelivered

    MessageResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SubscriptionPlan:
      type: object
      description: The active paid plan; null until a real subscription exists.
      properties:
        interval:
          type: string
          enum: [monthly, yearly]
        status:
          type: string
          enum: [active, canceled]
        cancelAtPeriodEnd:
          type: boolean
      required:
        - interval
        - status
        - cancelAtPeriodEnd

    Subscription:
      type: object
      properties:
        state:
          type: string
          enum: [trialing, pro, expired]
          description: Server-derived access state. hasProAccess is true only for "pro".
        hasProAccess:
          type: boolean
        trialDaysRemaining:
          type: integer
          description: Whole days left in the trial; 0 on the final day and when expired.
        trialStartedAt:
          type: string
          format: date-time
        trialEndsAt:
          type: string
          format: date-time
        trialLengthDays:
          type: integer
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        trialEndedAgoMs:
          type: integer
          format: int64
          description: Milliseconds since the trial ended; null unless state is "expired".
      required:
        - state
        - hasProAccess
        - trialDaysRemaining
        - trialStartedAt
        - trialEndsAt
        - trialLengthDays
        - plan
        - trialEndedAgoMs

    SubscriptionAccessResponse:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
      required:
        - subscription

    ProCapabilityResponse:
      type: object
      properties:
        status:
          type: string
        capability:
          type: string
        message:
          type: string
      required:
        - status
        - capability
        - message

    BillingConfigResponse:
      type: object
      properties:
        billing:
          type: object
          properties:
            provider:
              type: string
              enum: [paddle]
            environment:
              type: string
              enum: [sandbox, live]
            clientToken:
              type: string
              nullable: true
              description: Paddle client-side token (safe for the browser); null when unset.
            prices:
              type: object
              properties:
                monthly:
                  type: string
                  nullable: true
                yearly:
                  type: string
                  nullable: true
            checkoutAvailable:
              type: boolean
            reason:
              type: string
              nullable: true
              description: Machine-readable reason when checkoutAvailable is false.
          required: [provider, environment, prices, checkoutAvailable, reason]
      required: [billing]

    BillingPortalSessionResponse:
      type: object
      properties:
        status:
          type: string
        url:
          type: string
          description: The Paddle customer portal URL to open.
      required:
        - status
        - url

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
      required:
        - name

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - currentPassword
        - newPassword

    SessionInfo:
      type: object
      properties:
        id:
          type: string
          description: Opaque row identifier for display keys only — never the credential.
        current:
          type: boolean
          description: True when this row is the session making the request.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - current
        - createdAt
        - expiresAt

    SessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
      required:
        - sessions

    SessionRevokeResult:
      type: object
      properties:
        status:
          type: string
        revoked:
          type: integer
      required:
        - status
        - revoked

    JourneyResponse:
      type: object
      properties:
        journey:
          nullable: true
          description: The stored payload, or null when nothing has been saved yet.
      required:
        - journey

    JourneySaveRequest:
      type: object
      description: |-
        The validated journey/workspace envelope. The server owns the shape so
        the stored state can always be trusted; the client persists the whole
        workspace snapshot it derives from its single shared state system.
      properties:
        navigatorAnswers:
          type: object
          description: Navigator answers keyed by step; omitted when not taken.
          properties:
            goal:
              type: string
              maxLength: 120
            current:
              type: string
              maxLength: 120
            strength:
              type: string
              maxLength: 120
            path:
              type: string
              maxLength: 120
          additionalProperties: false
        completedStages:
          type: array
          description: Stages completed through real work, in canonical stage order.
          items:
            type: string
            enum: [Start, Shape, Move, Build, Launch, Grow]
          maxItems: 6
          uniqueItems: true
        libraryEntries:
          type: array
          description: Library pieces (sample seeds and user-added pieces).
          maxItems: 500
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 80
              kind:
                type: string
                enum: [Idea, Note, Resource, Output]
              title:
                type: string
                maxLength: 300
              excerpt:
                type: string
                maxLength: 4000
              date:
                type: string
                maxLength: 60
              stage:
                type: string
                enum: [Start, Shape, Move, Build, Launch, Grow]
                nullable: true
              saved:
                type: boolean
                nullable: true
              sample:
                type: boolean
                nullable: true
            required: [id, kind, title, excerpt, date]
            additionalProperties: false
        events:
          type: array
          description: Real session journey events already recorded for this account.
          maxItems: 200
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - navigator-completed
                  - journey-started
                  - next-move-started
                  - stage-completed
                  - library-piece-added
                  - library-piece-saved
              stamp:
                type: string
                maxLength: 60
              stage:
                type: string
                enum: [Start, Shape, Move, Build, Launch, Grow]
                nullable: true
            required: [key, stamp]
            additionalProperties: false
        notificationReadIds:
          type: array
          description: Notification ids already read (samples plus real events).
          maxItems: 200
          items:
            type: string
            maxLength: 120
        clearedNotifications:
          type: boolean
          description: True when the user cleared the whole notification feed.
        settings:
          type: object
          description: Workspace settings (notification + presentation toggles and identity).
          properties:
            displayName:
              type: string
              maxLength: 120
            email:
              type: string
              maxLength: 254
            emailDigest:
              type: boolean
            productUpdates:
              type: boolean
            journeyReminders:
              type: boolean
            compactMode:
              type: boolean
            reducedMotion:
              type: boolean
          additionalProperties: false
        hasStartedNextMove:
          type: boolean
      required:
        - completedStages
        - libraryEntries
        - events
        - notificationReadIds
        - clearedNotifications
        - settings
        - hasStartedNextMove

    JourneySaveResult:
      type: object
      properties:
        status:
          type: string
        savedAt:
          type: string
          format: date-time
          description: Server-stamped time of the accepted write.
      required:
        - status
        - savedAt

    AccountExport:
      type: object
      properties:
        account:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            emailVerified:
              type: boolean
            createdAt:
              type: string
              format: date-time
          required: [id, name, email, emailVerified, createdAt]
        subscription:
          nullable: true
          description: The server-derived subscription state at export time.
        journey:
          nullable: true
          description: The stored journey payload, or null when never saved.
        billing:
          type: object
          description: Linked billing identifiers, null when no purchase exists.
          properties:
            customerId:
              type: string
              nullable: true
            subscriptionId:
              type: string
              nullable: true
          required: [customerId, subscriptionId]
        exportedAt:
          type: string
          format: date-time
      required:
        - account
        - subscription
        - journey
        - billing
        - exportedAt
